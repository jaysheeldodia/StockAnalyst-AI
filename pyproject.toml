[project]
name = "stock-analyst"
version = "0.1.0"
description = "Production-quality multi-agent stock analyst system built with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "langgraph>=0.2.45",
  "langchain>=0.3.7",
  "langchain-core>=0.3.18",
  "langchain-openai>=0.2.14",
  "langsmith>=0.1.142",
  "chromadb>=0.5.11",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "httpx>=0.27.2",
  "aiosqlite>=0.20.0",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.3",
  "numpy>=2.1.2",
  "ragas>=0.2.5",
  "tenacity>=9.0.0",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
